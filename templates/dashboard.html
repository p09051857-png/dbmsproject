<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard — AUREX</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-brand">■ AUREX </div>
    <div class="nav-links">
      <a href="/dashboard" class="active">Dashboard</a>
      <a href="/transactions">Transactions</a>
      <a href="/new-transaction">New Txn</a>
      <a href="/fraud">Fraud Alerts</a>
      <a href="/api/logout" class="logout">Logout</a>
    </div>
  </nav>
  <div class="container">
    <h2 class="page-title">Welcome, <span id="uname"></span></h2>
    <div class="stats-grid">
      <div class="stat-card">
        <p class="stat-label">Total Transactions</p>
        <p class="stat-val" id="total_txns">—</p>
      </div>
      <div class="stat-card">
        <p class="stat-label">Total Spent</p>
        <p class="stat-val" id="total_spent">—</p>
      </div>
      <div class="stat-card warn">
        <p class="stat-label">Flagged Transactions</p>
        <p class="stat-val" id="flagged_txns">—</p>
      </div>
      <div class="stat-card danger">
        <p class="stat-label">Pending Alerts</p>
        <p class="stat-val" id="pending_alerts">—</p>
      </div>
    </div>
    <h3 class="section-title">My Cards</h3>
    <div id="cards-grid" class="cards-grid"></div>
    <h3 class="section-title">Recent Transactions</h3>
    <div class="table-wrap">
      <table id="recent-table">
        <thead><tr>
          <th>ID</th><th>Merchant</th><th>Amount</th>
          <th>Status</th><th>Time</th>
        </tr></thead>
        <tbody id="recent-body"></tbody>
      </table>
    </div>
  </div>
  <script src="/static/script.js"></script>
  <script>loadDashboard();</script>
</body>
</html>
