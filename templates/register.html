<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register — AUREX</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <span class="logo-icon">■</span>
      <h1>AUREX</h1>
    </div>
    <p class="auth-sub">Create a new account</p>
    <div id="msg" class="msg hide"></div>
    <div class="form-group">
      <label>Full Name</label>
      <input type="text" id="name" placeholder="Rahul Sharma">
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="email" placeholder="you@email.com">
    </div>
    <div class="form-group">
      <label>Phone</label>
      <input type="text" id="phone" placeholder="9876543210">
    </div>
    <div class="form-group">
      <label>Address</label>
      <input type="text" id="address" placeholder="City, State">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="••••••••">
    </div>
    <button class="btn-primary" onclick="doRegister()">Create Account</button>
    <p class="auth-link">Already registered? <a href="/login">Sign in</a></p>
  </div>
  <script src="/static/script.js"></script>
</body>
</html>
